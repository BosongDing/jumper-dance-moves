# How big each move can be on Jumper (its MuJoCo model), at 90, 125 and 160 BPM.
#
# k_max[body][claw]: the largest scale of the body move's shape (layers.BODY) that
#   still passes every check in robot.py: reachable, servos fast enough, COM and ZMP
#   over the feet, arms clear of the shell and of each other. -1 means "not at all".
# claw_max[claw]: same idea for the claw intensity.
#
# Written by limits.py. The amplitude actually danced is intensity * k_max.
# These are the numbers the shipped policy was trained with. They were probed before a
# later change to the IK, so probing again gives slightly different values for some pairs.
